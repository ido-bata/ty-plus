# Temporary trusted-branch bootstrap for the Bun lockfile migration.
# Remove this workflow in #358 after it commits bun.lock.
name: cf dependency lock bootstrap

on:
  push:
    branches: ["358"]
    paths:
      - ".github/workflows/cf-lock-bootstrap.yml"
      - "apps/web/package.json"

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'ido-bata/ty-plus' && github.ref == 'refs/heads/358'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - name: Resolve pinned cf dependencies into workspace lockfile
        run: bun install --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(web): lock cf CLI and Vite plugin dependencies (#358)"
          git push origin HEAD:358
