name: CI

# GitHub Actions are pinned to full commit SHAs (supply-chain hardening,
# inherited from the old repository's gate). To refresh, resolve the current
# upstream tag / branch head and update each `uses: <action>@<sha>` line.
# Last refreshed: 2026-11-11 (carried over from rebuildup/ty-plus#19):
#   actions/checkout        tag v4   -> 11d5960a326750d5838078e36cf38b85af677262
#   oven-sh/setup-bun       tag v2   -> 0c5077e51419868618aeaa5fe8019c62421857d6
#   dtolnay/rust-toolchain  stable   -> 6bed0761d98439e5a578e2877258200ad565ba87 (tracks stable HEAD; bump when rust toolchain moves)
#   swatinem/rust-cache     tag v2   -> 49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
#   actions/upload-artifact tag v4   -> ea165f8d65b6e75b540449e92b4886f43607fa02

on:
  # The release gate is `bun run ci` partitioned across the jobs below. Every
  # job calls one of the `ci:*` scripts in package.json; individual lint /
  # build / check commands are never restated here, so the partition cannot
  # drift from the local gate. `release-gate` is the only job whose result
  # means anything on its own.
  pull_request:
  push:
    # `release-*` must be listed: the operation-worker jobs below gate on
    # `refs/heads/release-*` push refs, and without this trigger the only
    # way to run native verification was workflow_dispatch or the
    # `native-build` PR label — release branches never got it (Issue #61).
    branches: [main, 'release-*']
  workflow_dispatch:
    inputs:
      product_version:
        description: >-
          Expected product version, e.g. 0.10.0. Supplied by the release gate
          so the manifest version is checked against an expectation that does
          not come from the artifact's own source of truth. Leave empty to
          skip the version probe.
        required: false
        type: string

# Default to the narrowest token scope the existing jobs need.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a push during a PR
# build doesn't waste CI minutes on a soon-stale result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vendored Agent Skills must match skills-lock.json exactly (ADR-0002).
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun scripts/check/vendored-skills.ts
      # README languages come from the app's SUPPORTED_LOCALES. This test is
      # included in the release gate (skills is one of its required partitions).
      - name: Validate public README languages and links
        run: bun scripts/check/check-readme-locales.ts

  # lint, build, the artifact verifiers, typecheck, boundaries,
  # react-doctor, rust and knip. No browser, so it needs neither
  # Playwright nor the disk reclaim below.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      # Pinned to the channel in rust-toolchain.toml. `ci:static` includes
      # `check:rust` (fmt + clippy + workspace/boundary checks + cargo test),
      # so the toolchain must be present before the job runs.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: rust

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # `styled-system/` is gitignored and regenerated by `panda codegen` /
      # `panda cssgen`. The install step uses `--ignore-scripts` which skips
      # the `prepare` hook, so the generation must be invoked explicitly here.
      # Without it the vite build fails to resolve
      # `@import "../../../../styled-system/styles.css"` in
      # `src/management/panel/styles/app.css`.
      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      - name: Static gate
        run: bun run ci:static
        env:
          # Makes the manifest version probe load-bearing for the release gate.
          # Empty means the probe reports itself as skipped.
          TY_PLUS_EXPECT_PRODUCT_VERSION: ${{ inputs.product_version }}

  # The Node-environment project on its own. Node-only, so it needs neither
  # Playwright nor the disk reclaim.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      - name: Unit tests
        run: bun run ci:unit

  # The coverage ratchet, over the same project `ci:coverage` scopes.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      - name: Coverage
        run: bun run ci:coverage

  # The `storybook` project drives headless Chromium, which holds its shared
  # memory as unlinked temp files for the lifetime of each browser process.
  # Left unbounded it emptied an ubuntu runner's filesystem twice mid-run
  # (ENOSPC in old-repo run 36949062255), and a single-browser run peaked past
  # 12 GB of RAM. Four shards keep the worst shard at ~3.2 GB (measured in
  # old-repo run 37121187448) against ~7.9 GB of runner RAM; all 123 files and
  # all 474 tests still run. The reclaim below frees the image's unused
  # toolchains to make room; a tmpfs was tried and is the wrong tool (it is
  # RAM, so it doubled the charge instead of buying disk).
  storybook:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Reclaim the toolchains this job cannot use
        run: |
          sudo rm -rf /var/cache/apt/archives
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /usr/lib/mono /opt/az
          sudo rm -rf /opt/hostedtoolcache/Node* /opt/hostedtoolcache/Python* /opt/hostedtoolcache/Java*
          sudo rm -rf /opt/hostedtoolcache/dn* /opt/hostedtoolcache/ServiceWorker* /opt/hostedtoolcache/az* /opt/hostedtoolcache/msbuild*
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/haskell /opt/hostedtoolcache/npm /opt/hostedtoolcache/powershell
          # 1777, not the 755 that `mkdir` leaves: the runner user has to be
          # able to create Playwright's profile and artifacts directories
          # inside it.
          sudo mkdir -p /mnt/gate-tmp
          sudo chmod 1777 /mnt/gate-tmp
          df -k / | tail -1

      - name: Storybook shard
        run: bun run ci:storybook -- --shard=${{ matrix.shard }}/4
        env:
          # Chromium creates its unlinked temp files in `$TMPDIR`; pointing it
          # at the reclaimed directory keeps the space attributable and off
          # the runner's default /tmp.
          TMPDIR: /mnt/gate-tmp

  # Build and verify the real operation-worker binary on the platform that
  # owns it. The ubuntu `static` job compiles the platform-specific
  # host-filesystem tests out, so these jobs are the only place the native
  # behaviour runs in CI. Skipped on ordinary PRs (label `native-build` opts
  # in); they always run on main and on dispatch.
  operation-worker-windows:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-build'))
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
          targets: x86_64-pc-windows-msvc

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      - name: Build unsigned Windows worker
        run: bun run build:operation-worker -- --target x86_64-pc-windows-msvc

      - name: Upload unsigned Windows worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-worker-unsigned-windows-${{ github.sha }}
          path: dist/worker/staging/windows
          if-no-files-found: error

      - name: Build CEP development bundle
        run: bun run build:cep:dev

      - name: Verify packaged Windows operation worker
        run: bun run verify:operation-worker:process

      - name: Test real Windows operation worker process
        run: bun run vitest run scripts/verify/verify-operation-worker-process.test.ts

      - name: Upload Windows operation worker verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-worker-verification-windows-${{ github.sha }}
          path: .tmp/operation-worker-verification/windows-process.json
          if-no-files-found: error

  operation-worker-macos:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-'))) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'native-build'))
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      # `host-filesystem` is the only crate with `#[cfg(target_os = "macos")]`
      # tests, so the ubuntu `static` job compiles them out. Run the crate's
      # tests on the platform that owns the code. `TMPDIR` is redirected
      # because the scanner refuses to traverse a symlinked path component
      # (`O_NOFOLLOW`) and macOS's default temp directories sit under
      # `/var` -> `/private/var`; a workspace directory has no symlinked
      # ancestor, so the fixtures reach the behaviour under test.
      - name: Test the macOS scanner crate
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/macos-rust-tests
        run: |
          mkdir -p "$TMPDIR"
          cargo test --manifest-path rust/Cargo.toml -p ty-plus-host-filesystem --all-features

      - name: Build unsigned universal macOS worker
        run: >-
          bun run build:operation-worker --
          --target aarch64-apple-darwin
          --target x86_64-apple-darwin

      - name: Archive unsigned universal macOS worker
        run: tar -cf dist/worker/operation-worker-unsigned-macos-universal.tar -C dist/worker/staging macos

      - name: Upload unsigned universal macOS worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-worker-unsigned-macos-universal-${{ github.sha }}
          path: dist/worker/operation-worker-unsigned-macos-universal.tar
          if-no-files-found: error

      - name: Build CEP development bundle
        run: bun run build:cep:dev

      - name: Check macOS worker executable bit
        run: test -x "$(find dist/cep-dev/worker/versions -type f -name operation-worker -print -quit)"

      - name: Verify packaged macOS operation worker
        run: bun run verify:operation-worker:process

      - name: Test real macOS operation worker process
        run: bun run vitest run scripts/verify/verify-operation-worker-process.test.ts

      - name: Upload macOS operation worker verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-worker-verification-macos-${{ github.sha }}
          path: .tmp/operation-worker-verification/macos-process.json
          if-no-files-found: error

  # The release gate's verdict. It runs no checks of its own — it exists so
  # that "the release gate passed" is one job whose conclusion can be read,
  # rather than an inference from the others. `if: always()` because a skipped
  # gate must stay distinguishable from a gate nobody ran.
  release-gate:
    name: release gate
    if: always()
    needs:
      - skills
      - static
      - unit
      - coverage
      - storybook
      - operation-worker-windows
      - operation-worker-macos
    runs-on: ubuntu-latest

    steps:
      - name: Every partition must have succeeded
        env:
          PARTITIONS: ${{ toJSON(needs) }}
        run: |
          echo "== release gate partitions =="
          echo "$PARTITIONS" | jq -r 'to_entries[] | "  \(.key)\t\(.value.result)\t\(.value.conclusion // "-")"'
          failed=$(echo "$PARTITIONS" | jq '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::release gate failed: $failed partitions did not succeed"
            exit 1
          fi
          echo "All non-skipped partitions succeeded."
