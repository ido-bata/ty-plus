name: internal build

# Internal verification builds (Issue #6 / #10 preparation).
#
# These are NOT distribution artifacts: they use the `development-unsigned`
# trust mode (panel and worker manifest agree, no certificate involved) and
# are for the device verification session (#10) and internal testing only.
#
# Distribution (release-trust) builds require OS-signed worker binaries
# (Authenticode / codesign + notarization) and a signed ZXP. The signing
# identity and certificate ownership are unresolved decisions — see
# docs/architecture/distribution.md. This workflow deliberately has no
# publish step: creating a GitHub Release or any public artifact is a
# manual, user-authorized action.

on:
  workflow_dispatch:
    inputs:
      product_version:
        description: >-
          Expected product version (e.g. 0.10.0). Leave empty to use the
          package.json version. Supplied to the package verification gate so
          the version probes are load-bearing.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  internal-verification-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            rust_targets: x86_64-pc-windows-msvc
            artifact_suffix: windows
          - os: macos-latest
            platform: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact_suffix: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.rust_targets }}

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # `styled-system/` is gitignored and regenerated by the panda CLI; the
      # install step uses `--ignore-scripts` which skips the `prepare` hook.
      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      # The development CEP build produces the consistent
      # `development-unsigned` pair: the panel's expected trust mode and the
      # worker manifest's declared mode. It stages a release-profile worker
      # binary (`stageOperationWorkerTargets` builds with `--release`), so the
      # binary under test is the distribution binary, unsigned.
      - name: Build CEP bundle (development-unsigned trust)
        run: bun run build:cep:dev

      - name: Resolve expected product version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.product_version }}" ]; then
            echo "expected=${{ inputs.product_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "expected=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"
          fi

      # Load-bearing probes: worker binary presence + sha256 vs the trust
      # manifest, extension manifest binding, version agreement. The binary
      # path is resolved through the worker manifest (same source the runtime
      # uses).
      - name: Verify packaged bundle
        run: >-
          bun run verify:online-gateway:package --
          --trust-mode=development-unsigned
          --product-version=${{ steps.version.outputs.expected }}

      - name: Package unsigned zip
        run: bun run scripts/package/package-cep-archive.ts zip

      - name: Name artifact with build metadata
        shell: bash
        run: |
          version="${{ steps.version.outputs.expected }}"
          commit="$(git rev-parse --short=7 HEAD)"
          name="ty-plus-internal-${version}-${{ matrix.artifact_suffix }}-${commit}.zip"
          mv dist/app.ty-plus.zip "dist/${name}"
          echo "artifact_name=${name}" >> "$GITHUB_ENV"

      - name: Generate release manifest
        run: >-
          bun scripts/package/release-manifest.ts
          --trust-mode=development-unsigned
          --artifact=dist/${{ env.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ty-plus-internal-${{ matrix.artifact_suffix }}-${{ github.sha }}
          path: |
            dist/${{ env.artifact_name }}
            dist/release-manifest.json
          if-no-files-found: error

  # Fail-closed contract for release-trust builds (#32): with no signing
  # configuration present, the build must refuse before producing anything.
  # This job proves the refusal in CI — it never reports a PASS for an
  # unsigned build and has no publish step.
  release-trust-gate-refusal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Refuse an unsigned release-trust build
        shell: bash
        run: |
          if bun scripts/package/build-release.ts 2> refusal.log; then
            echo "::error::release-trust build must refuse without signing configuration"
            exit 1
          fi
          grep -q "refuses to continue unsigned" refusal.log

  # The Windows release-trust distribution candidate (ADR-0003): the worker
  # is legitimately unsigned in R0, so the full release pipeline — production
  # build, release-trust verify gate, secret scan, packaging, ZXP signing +
  # verification, artifact audit — runs WITHOUT any Authenticode
  # configuration. The ZXP signature is the independent Adobe trust chain:
  # this job demonstrates the mechanism with an ephemeral self-signed
  # certificate generated here (never published); the production signing
  # subject remains an owner decision (#32). No publish step exists.
  release-trust-windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
          targets: x86_64-pc-windows-msvc

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # `styled-system/` is gitignored and regenerated by the panda CLI; the
      # install step uses `--ignore-scripts` which skips the `prepare` hook.
      - name: Generate PandaCSS runtime + styles
        run: bunx panda codegen --silent && bunx panda cssgen --silent

      # Ephemeral mechanism-demonstration certificate: generated here, used
      # for this job's ZXP signature only, discarded with the runner. The
      # production ZXP signing subject is an unresolved owner decision (#32).
      - name: Generate ephemeral ZXP signing certificate
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP "ty-plus-zxp-selfsigned.p12"
          $password = [guid]::NewGuid().ToString("N")
          & .\reference\Adobe-CEP\CEP-Resources\ZXPSignCMD\4.1.3\x64\ZXPSignCmd.exe -selfSignedCert JP Tokyo ty-plus "ty-plus pipeline demo" $password $cert -validityDays 3650
          if ($LASTEXITCODE -ne 0) { throw "ZXPSignCmd self-signed certificate generation failed" }
          "TY_PLUS_ZXP_CERT_PATH=$cert" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TY_PLUS_ZXP_CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run the release-trust build (unsigned Windows worker)
        run: bun scripts/package/build-release.ts

      - name: Audit the release artifacts
        run: bun scripts/verify/verify-release-artifacts.ts

      - name: Name the distribution candidate
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $commit = git rev-parse --short=7 HEAD
          "candidate_name=ty-plus-release-candidate-$version-windows-$commit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload the distribution candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ty-plus-release-candidate-windows-${{ github.sha }}
          path: |
            dist/app.ty-plus.zip
            dist/app.ty-plus.zxp
            dist/release-manifest.json
          if-no-files-found: error
