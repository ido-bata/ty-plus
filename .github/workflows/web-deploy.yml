name: Web cf deployment

# Cloudflare Workers build and deployment. No Wrangler or CF credentials on PRs.
on:
  push:
    branches: ["358", "release-*"]
  pull_request:
    paths:
      - "apps/web/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Target Worker (select explicitly)"
        required: true
        type: choice
        options:
          - preview
          - production
      site_origin:
        description: "Exact https://<worker>.<subdomain>.workers.dev origin"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-cf-${{ github.event_name }}-${{ inputs.target || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET: ${{ inputs.target || 'production' }}
      VITE_TY_PLUS_SITE_ORIGIN: ${{ inputs.site_origin || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Validate target origin before building
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == preview ]]; then expected='ty-plus-web-preview'; else expected='ty-plus-web'; fi
          if [[ ! "$VITE_TY_PLUS_SITE_ORIGIN" =~ ^https://${expected}\.[a-zA-Z0-9-]+\.workers\.dev$ ]]; then
            echo "::error::site_origin must be the exact https://${expected}.<account-subdomain>.workers.dev origin"
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Panda CSS
        run: |
          bunx panda codegen --silent
          bunx panda cssgen --silent
          bunx panda codegen --config apps/web/panda.config.ts --cwd apps/web --silent
          bunx panda cssgen --config apps/web/panda.config.ts --cwd apps/web --silent

      - name: Record public source SHA for post-deploy attestation
        shell: bash
        run: |
          printf '{"sourceSha":"%s","target":"%s"}\n' "$GITHUB_SHA" "$TARGET" > apps/web/public/deploy-info.json

      - name: Cloudflare cf Build Output v1
        working-directory: apps/web
        run: |
          npm exec --no -- cf build --mode "$TARGET"
          test -s .cloudflare/output/v1/config.json
          node -e 'const f=require("./.cloudflare/output/v1/config.json"); if (f.buildContext?.mode !== process.env.TARGET) throw Error("cf Build Output mode mismatch");'

      - name: Remote-free deployment dry-run
        working-directory: apps/web
        run: npm exec --no -- cf deploy --prebuilt --mode "$TARGET" --dry-run

      - name: Upload exactly the validated Build Output
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-cf-build-${{ github.sha }}-${{ inputs.target }}
          path: apps/web/.cloudflare/output/v1
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: web-${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      SITE_ORIGIN: ${{ inputs.site_origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable) in web-$TARGET GitHub environment"
            exit 1
          fi

      - name: Install locked deployment CLI
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-cf-build-${{ github.sha }}-${{ inputs.target }}
          path: apps/web/.cloudflare/output/v1

      - name: Deploy the validated prebuilt artifact with cf
        working-directory: apps/web
        run: npm exec --no -- cf deploy --prebuilt --mode "$TARGET"

      - name: Verify deployed URL, routes and exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          for route in / /features /download /docs /changelog /support /sitemap.xml; do
            code=$(curl --connect-timeout 15 --max-time 45 --retry 3 -sSL -o /dev/null -w '%{http_code}' "${SITE_ORIGIN}${route}")
            if [[ "$code" != 200 ]]; then
              echo "::error::${route}: HTTP ${code} (expected 200)"
              exit 1
            fi
          done
          curl --fail --show-error --silent --location --retry 3 "${SITE_ORIGIN}/images/preset-grid.png" -o /dev/null
          curl --fail --show-error --silent --location --retry 3 "${SITE_ORIGIN}/deploy-info.json" > "$RUNNER_TEMP/deploy-info.json"
          node -e '
            const p = require(process.argv[1]);
            if (p.sourceSha !== process.env.GITHUB_SHA || p.target !== process.env.TARGET)
              throw Error("Unexpected deployed source SHA or target");
          ' "$RUNNER_TEMP/deploy-info.json"
          code=$(curl --connect-timeout 15 --max-time 45 -sSL -o /dev/null -w '%{http_code}' "${SITE_ORIGIN}/nonexistent-web-deployment-smoke")
          if [[ "$code" != 404 ]]; then
            echo "::error::unknown route returned ${code} instead of 404"
            exit 1
          fi
          echo "Verified source SHA ${GITHUB_SHA} at ${SITE_ORIGIN}"
