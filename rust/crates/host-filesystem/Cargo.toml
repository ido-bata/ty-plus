[package]
name = "ty-plus-host-filesystem"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ab_glyph = "0.2"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
fontdb = "0.16"
fs2 = "0.4.3"
fs_at = "0.2.1"
image = { version = ">=0.25.6, <0.25.10", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp", "webp"] }
imageproc = { version = "0.25", default-features = false }
resvg = "0.43"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10"
thiserror = "1"
ty-plus-protocol = { path = "../protocol" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
