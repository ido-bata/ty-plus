[package]
name = "ty-plus-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Binary entry point for ty-plus-cli. Thin: parses args, dispatches to domain commands, emits JSON envelopes."

[[bin]]
name = "ty-plus"
path = "src/main.rs"

[dependencies]
ty-plus-core.workspace = true
ty-plus-host.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
